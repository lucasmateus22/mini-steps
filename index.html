<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Jogo de plataforma 2D contínuo com checkpoints interativos, cenário procedural e arquitetura modular.">
  <meta name="theme-color" content="#0F172A">

  <!-- Segurança: Content Security Policy -->
  <!-- Nota: frame-ancestors só funciona como HTTP header, não em meta tags -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">

  <title>Plataforma 2D — Jogo de Aventura</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="gameContainer">
    <!-- Loading -->
    <div id="loadingOverlay">
      <div class="loading-spinner"></div>
      <p>Carregando...</p>
    </div>

    <!-- Canvas principal -->
    <canvas id="gameCanvas" width="100%" height="100%"></canvas>

    <!-- Info rodapé -->
    <p id="gameInfo">← → ou A/D para mover · ESPAÇO ou W para pular · Alcance os checkpoints!</p>

    <!-- Botão Fullscreen -->
    <button id="btnFullscreen" aria-label="Alternar tela cheia">
      <span class="fs-icon-expand">⛶</span>
      <span class="fs-icon-compress">⛶</span>
    </button>

    <!-- Controles mobile -->
    <div id="mobileControls">
      <div class="ctrl-group">
        <button id="btnLeft" class="ctrl-btn" aria-label="Mover esquerda">◀</button>
        <button id="btnRight" class="ctrl-btn" aria-label="Mover direita">▶</button>
      </div>
      <div class="ctrl-group">
        <button id="btnJump" class="ctrl-btn ctrl-btn-jump" aria-label="Pular">PULO</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { init } from './game.js';

    // Esconder loading quando o jogo iniciar
    window.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('loadingOverlay');
      // O game.js já chama init() via DOMContentLoaded
      // Esconder overlay após um breve delay
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 500);
    });
  </script>
</body>
</html>
